<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tela</title>
<style>
  :root {
    --bg: #0f0d12; --card: #1a1720; --line: #2c2735; --text: #f1ecf5; --muted: #a59bb0;
    --accent: #e86a92; --accent2: #f4a259; --ok: #5fd39a; --warn: #f4c95d; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; }
  .hidden { display: none !important; }

  /* Tela inicial */
  #lobby { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
  .card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 28px; }
  h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -.02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 22px; font-size: 15px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input, select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: #120f16; color: var(--text); outline: none; }
  input:focus, select:focus { border-color: var(--accent); }
  .row { display: flex; gap: 10px; margin-top: 22px; }
  .btn { flex: 1; padding: 13px 14px; border: 0; border-radius: 12px; cursor: pointer; font-weight: 600;
    background: var(--accent); color: #1a0a10; }
  .btn.alt { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .btn:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .5; cursor: default; }
  details { margin-top: 18px; color: var(--muted); font-size: 14px; }
  summary { cursor: pointer; }
  .err { color: var(--bad); font-size: 14px; margin-top: 14px; min-height: 1em; }

  /* Tela de quem transmite */
  #host { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
  #host .card { max-width: 640px; }
  #preview { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; margin: 14px 0; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); flex: none; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .dot.bad { background: var(--bad); }
  .note { font-size: 14px; color: var(--muted); margin-top: 10px; }
  .note.warn { color: var(--warn); }

  /* Tela de quem assiste */
  #viewer { position: fixed; inset: 0; background: #000; }
  #remote { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #waiting { position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    padding: 16px; color: var(--muted); pointer-events: none; }
  #waiting b { color: var(--text); display: block; font-size: 20px; margin-bottom: 6px; }
  #unmute { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 12px;
    padding: 14px 16px; background: linear-gradient(transparent, rgba(0,0,0,.75));
    transition: opacity .3s; }
  .bar.idle { opacity: 0; }
  .bar button { background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 10px;
    padding: 9px 12px; cursor: pointer; }
  .bar input[type=range] { width: 120px; accent-color: var(--accent); padding: 0; border: 0; background: none; }
  .spacer { flex: 1; }
  #stats { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,.65); padding: 10px 12px;
    border-radius: 10px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
</style>
</head>
<body>

<!-- ====== Entrada ====== -->
<section id="lobby">
  <div class="card">
    <h1>Te<span>la</span></h1>
    <p class="sub">Compartilhamento de tela só pra nós dois.</p>

    <label for="room">Nome da sala</label>
    <input id="room" autocomplete="off" placeholder="ex.: nossa-serie">
    <label for="pass">Senha</label>
    <input id="pass" type="password" autocomplete="off" placeholder="combinem uma senha">

    <details>
      <summary>Qualidade (para quem transmite)</summary>
      <label for="quality">Resolução e fluidez</label>
      <select id="quality">
        <option value="1080-60">1080p a 60 fps (recomendado)</option>
        <option value="1080-30">1080p a 30 fps (internet mais fraca)</option>
        <option value="1440-60">1440p a 60 fps (internet muito boa)</option>
        <option value="720-60">720p a 60 fps</option>
      </select>
      <label for="bitrate">Taxa de envio de vídeo</label>
      <select id="bitrate">
        <option value="4">4 Mbps (upload fraco)</option>
        <option value="8" selected>8 Mbps (recomendado)</option>
        <option value="15">15 Mbps (upload bom)</option>
        <option value="25">25 Mbps (fibra boa)</option>
      </select>
    </details>

    <div class="row">
      <button class="btn" id="btnHost">Transmitir minha tela</button>
      <button class="btn alt" id="btnWatch">Assistir</button>
    </div>
    <div class="err" id="lobbyErr"></div>
  </div>
</section>

<!-- ====== Quem transmite ====== -->
<section id="host" class="hidden">
  <div class="card">
    <div class="status"><span class="dot" id="hostDot"></span><span id="hostStatus">Preparando…</span></div>
    <video id="preview" muted playsinline autoplay></video>
    <div class="note" id="audioNote"></div>
    <div class="note" id="hostInfo"></div>
    <div class="row">
      <button class="btn alt" id="btnSwitch">Trocar tela/aba</button>
      <button class="btn alt" id="btnStop">Parar</button>
    </div>
  </div>
</section>

<!-- ====== Quem assiste ====== -->
<section id="viewer" class="hidden">
  <video id="remote" playsinline autoplay></video>
  <div id="waiting"><div><b id="waitTitle">Conectando…</b><span id="waitText"></span></div></div>
  <button class="btn hidden" id="unmute">Clique para ativar o som</button>
  <pre id="stats" class="hidden"></pre>
  <div class="bar" id="bar">
    <button id="btnVol" title="Mudo (M)">🔊</button>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="1" aria-label="Volume">
    <span class="spacer"></span>
    <button id="btnStats" title="Informações (I)">i</button>
    <button id="btnFull" title="Tela cheia (F)">⛶</button>
    <button id="btnLeave">Sair</button>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* =====================================================================
   CONFIGURAÇÃO
   - STUN: descobre o endereço público de cada um (grátis, do Google).
   - TURN: só é usado quando a conexão direta falha (ex.: 4G, redes de
     empresa/faculdade). Se um dia não conectar, crie uma conta grátis
     num serviço de TURN (ex.: metered.ca) e cole os dados abaixo.
   ===================================================================== */
const ICE_SERVERS = [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:stun1.l.google.com:19302" },
  // { urls: "turn:SEU-SERVIDOR:443?transport=tcp", username: "USUARIO", credential: "SENHA" },
];

/* Servidor de sinalização: por padrão o servidor público e gratuito do
   PeerJS. Ele só troca a "apresentação" entre os navegadores; o vídeo
   vai direto de um computador para o outro. Dá para trocar via URL:
   ?peerhost=localhost&peerport=9000&peersecure=0 */
const SIGNAL_HOST = ""; // ex.: "tela-sinal.onrender.com" (servidor próprio). Vazio = servidor público do PeerJS.
const qs = new URLSearchParams(location.search);
const PEER_OPTS = { config: { iceServers: ICE_SERVERS }, debug: 1 };
if (SIGNAL_HOST && !qs.get("peerhost")) {
  Object.assign(PEER_OPTS, { host: SIGNAL_HOST, port: 443, secure: true, path: "/" });
  // O plano grátis do Render "dorme" sem uso; isso acorda o servidor assim que a página abre.
  fetch("https://" + SIGNAL_HOST + "/").catch(() => {});
}
if (qs.get("peerhost")) {
  PEER_OPTS.host = qs.get("peerhost");
  PEER_OPTS.port = Number(qs.get("peerport") || 443);
  PEER_OPTS.secure = qs.get("peersecure") !== "0";
  PEER_OPTS.path = qs.get("peerpath") || "/";
}

const $ = (id) => document.getElementById(id);
const show = (id) => ["lobby", "host", "viewer"].forEach((s) => $(s).classList.toggle("hidden", s !== id));

/* ---------- Lembrar a sala neste navegador ---------- */
try {
  $("room").value = localStorage.getItem("tela.room") || "";
  $("pass").value = localStorage.getItem("tela.pass") || "";
  $("quality").value = localStorage.getItem("tela.quality") || "1080-60";
  $("bitrate").value = localStorage.getItem("tela.bitrate") || "8";
} catch {}
function remember() {
  try {
    localStorage.setItem("tela.room", $("room").value);
    localStorage.setItem("tela.pass", $("pass").value);
    localStorage.setItem("tela.quality", $("quality").value);
    localStorage.setItem("tela.bitrate", $("bitrate").value);
  } catch {}
}

/* A sala vira um código derivado de nome + senha. Sem a senha certa,
   ninguém encontra a transmissão. */
async function roomId() {
  const room = $("room").value.trim().toLowerCase();
  const pass = $("pass").value;
  if (!room || !pass) throw new Error("Preencha o nome da sala e a senha.");
  const data = new TextEncoder().encode("tela-v1|" + room + "|" + pass);
  const hash = await crypto.subtle.digest("SHA-256", data);
  return "tela-" + [...new Uint8Array(hash)].slice(0, 16).map((b) => b.toString(16).padStart(2, "0")).join("");
}

/* Áudio em estéreo e com mais qualidade (o padrão do WebRTC é mono, pensado para voz). */
function sdpTransform(sdp) {
  const m = sdp.match(/a=rtpmap:(\d+) opus\/48000\/2/i);
  if (!m) return sdp;
  const pt = m[1];
  const re = new RegExp("a=fmtp:" + pt + " ([^\\r\\n]*)");
  const extra = "stereo=1;sprop-stereo=1;maxaveragebitrate=256000;cbr=0;useinbandfec=1";
  if (re.test(sdp)) {
    return sdp.replace(re, (line, params) => {
      const kept = params.split(";").filter((p) => !/^(stereo|sprop-stereo|maxaveragebitrate|cbr|useinbandfec)=/.test(p.trim()));
      return "a=fmtp:" + pt + " " + [...kept, extra].join(";");
    });
  }
  return sdp.replace(m[0], m[0] + "\r\na=fmtp:" + pt + " " + extra);
}

function lobbyError(msg) { $("lobbyErr").textContent = msg || ""; }

/* =====================================================================
   QUEM TRANSMITE
   ===================================================================== */
let hostPeer = null, stream = null;
const viewers = new Map(); // peerId -> MediaConnection

async function captureScreen() {
  const [h, fps] = $("quality").value.split("-").map(Number);
  const w = Math.round((h * 16) / 9);
  const s = await navigator.mediaDevices.getDisplayMedia({
    video: { width: { ideal: w, max: w }, height: { ideal: h, max: h }, frameRate: { ideal: fps, max: fps } },
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 2, sampleRate: 48000 },
    systemAudio: "include",
    surfaceSwitching: "include",
    selfBrowserSurface: "exclude",
  });
  const v = s.getVideoTracks()[0];
  if (v && "contentHint" in v) v.contentHint = "motion"; // prioriza fluidez (vídeo), não texto parado
  const a = s.getAudioTracks()[0];
  if (a && "contentHint" in a) a.contentHint = "music";
  v.addEventListener("ended", () => {
    if (stream === s) setHostStatus("bad", "A captura foi encerrada. Clique em “Trocar tela/aba” para voltar.");
  });
  return s;
}

function updateAudioNote() {
  const has = stream && stream.getAudioTracks().length > 0;
  $("audioNote").className = "note" + (has ? "" : " warn");
  $("audioNote").textContent = has
    ? "🔊 O áudio está sendo transmitido junto."
    : "⚠️ Sem áudio! Ao escolher a tela, marque “Compartilhar áudio” (no Chrome/Edge). Clique em “Trocar tela/aba” para tentar de novo.";
}

function setHostStatus(kind, text) {
  $("hostDot").className = "dot" + (kind === "ok" ? " ok" : kind === "bad" ? " bad" : "");
  $("hostStatus").textContent = text;
}
function refreshHostStatus() {
  const n = [...viewers.values()].filter((c) => c.peerConnection && c.peerConnection.connectionState === "connected").length;
  if (n > 0) setHostStatus("ok", n === 1 ? "Transmitindo para 1 pessoa ❤" : `Transmitindo para ${n} pessoas`);
  else setHostStatus("", "No ar. Esperando alguém entrar na sala…");
}

async function tuneSenders(pc) {
  const maxBitrate = Number($("bitrate").value) * 1_000_000;
  const fps = Number($("quality").value.split("-")[1]);
  for (const sender of pc.getSenders()) {
    if (!sender.track) continue;
    const p = sender.getParameters();
    if (!p.encodings || !p.encodings.length) p.encodings = [{}];
    if (sender.track.kind === "video") {
      p.encodings[0].maxBitrate = maxBitrate;
      p.encodings[0].maxFramerate = fps;
      p.encodings[0].scaleResolutionDownBy = 1;
      p.encodings[0].priority = "high";
      p.encodings[0].networkPriority = "high";
      p.degradationPreference = "balanced";
    } else {
      p.encodings[0].maxBitrate = 256_000;
      p.encodings[0].priority = "high";
      p.encodings[0].networkPriority = "high";
    }
    try { await sender.setParameters(p); } catch (e) { console.warn("setParameters", e); }
  }
}

function callViewer(viewerId) {
  const old = viewers.get(viewerId);
  if (old) try { old.close(); } catch {}
  const call = hostPeer.call(viewerId, stream, { sdpTransform });
  viewers.set(viewerId, call);
  const pc = call.peerConnection;
  const onState = () => {
    if (pc.connectionState === "connected") tuneSenders(pc);
    if (["failed", "closed"].includes(pc.connectionState)) viewers.delete(viewerId);
    refreshHostStatus();
  };
  pc.addEventListener("connectionstatechange", onState);
  call.on("close", () => { if (viewers.get(viewerId) === call) viewers.delete(viewerId); refreshHostStatus(); });
  call.on("error", (e) => console.warn("call error", e));
}

async function startHost() {
  lobbyError("");
  let id;
  try { id = await roomId(); } catch (e) { return lobbyError(e.message); }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    return lobbyError("Este navegador não permite compartilhar a tela. Use o Chrome ou o Edge no computador.");
  }
  remember();
  try { stream = await captureScreen(); }
  catch (e) { return lobbyError("Você cancelou ou o navegador bloqueou a captura da tela."); }

  show("host");
  $("preview").srcObject = stream;
  updateAudioNote();
  setHostStatus("", "Abrindo a sala…");
  $("hostInfo").textContent = "Mande para ela o link deste site com o mesmo nome de sala e senha. Ela clica em “Assistir”.";

  hostPeer = new Peer(id, PEER_OPTS);
  hostPeer.on("open", refreshHostStatus);
  hostPeer.on("connection", (conn) => {
    conn.on("open", () => callViewer(conn.peer));
    conn.on("data", (msg) => { if (msg === "reconnect") callViewer(conn.peer); });
  });
  hostPeer.on("disconnected", () => { setTimeout(() => hostPeer && !hostPeer.destroyed && hostPeer.reconnect(), 1500); });
  hostPeer.on("error", (e) => {
    console.warn("peer error", e.type, e);
    if (e.type === "unavailable-id") setHostStatus("bad", "Já tem alguém transmitindo nessa sala (talvez outra aba sua). Feche-a e tente de novo.");
    else if (e.type === "network" || e.type === "server-error" || e.type === "socket-error") setHostStatus("bad", "Sem conexão com o servidor de sinalização. Tentando de novo…");
  });
}

async function switchScreen() {
  let s;
  try { s = await captureScreen(); } catch { return; }
  const old = stream;
  stream = s;
  $("preview").srcObject = s;
  updateAudioNote();
  // Troca as faixas sem derrubar a conexão; se mudar a presença do áudio, renegocia.
  for (const [vid, call] of viewers) {
    const pc = call.peerConnection;
    const senders = pc.getSenders();
    const vSender = senders.find((x) => x.track ? x.track.kind === "video" : false) || senders[0];
    const aSender = senders.find((x) => x.track && x.track.kind === "audio");
    const newA = s.getAudioTracks()[0];
    if (vSender) await vSender.replaceTrack(s.getVideoTracks()[0]);
    if (aSender && newA) await aSender.replaceTrack(newA);
    else if (!aSender && newA) callViewer(vid); // antes não tinha áudio, agora tem
  }
  old && old.getTracks().forEach((t) => t.stop());
  refreshHostStatus();
}

function stopHost() {
  viewers.forEach((c) => { try { c.close(); } catch {} });
  viewers.clear();
  stream && stream.getTracks().forEach((t) => t.stop());
  stream = null;
  if (hostPeer) hostPeer.destroy();
  hostPeer = null;
  show("lobby");
}

/* =====================================================================
   QUEM ASSISTE
   ===================================================================== */
let viewPeer = null, hostId = null, dataConn = null, currentCall = null, retryTimer = null, statsTimer = null;

function setWaiting(title, text) {
  $("waiting").classList.toggle("hidden", !title);
  $("waitTitle").textContent = title || "";
  $("waitText").textContent = text || "";
}

function scheduleRetry(ms = 3000) {
  clearTimeout(retryTimer);
  retryTimer = setTimeout(connectToHost, ms);
}

function connectToHost() {
  if (!viewPeer || viewPeer.destroyed) return;
  if (viewPeer.disconnected) { viewPeer.reconnect(); return scheduleRetry(); }
  try { dataConn && dataConn.close(); } catch {}
  dataConn = viewPeer.connect(hostId, { reliable: true });
  // Se em 10 s nada acontecer, tenta de novo.
  scheduleRetry(10000);
  dataConn.on("open", () => setWaiting("Conectando…", "Recebendo a transmissão."));
  dataConn.on("close", () => { if (!currentCall) scheduleRetry(); });
}

async function startWatch() {
  lobbyError("");
  try { hostId = await roomId(); } catch (e) { return lobbyError(e.message); }
  remember();
  show("viewer");
  setWaiting("Conectando…", "");
  const video = $("remote");
  video.muted = false;

  createViewPeer();
  clearInterval(statsTimer);
  statsTimer = setInterval(updateStats, 1000);
}

function createViewPeer() {
  const video = $("remote");
  try { viewPeer && viewPeer.destroy(); } catch {}
  viewPeer = new Peer(PEER_OPTS);
  viewPeer.on("open", connectToHost);
  viewPeer.on("disconnected", () => setTimeout(() => viewPeer && !viewPeer.destroyed && viewPeer.reconnect(), 1500));
  viewPeer.on("error", (e) => {
    if (e.type === "peer-unavailable") {
      setWaiting("Esperando a transmissão começar…", "Confira se o nome da sala e a senha são iguais aos da outra pessoa.");
      scheduleRetry(3000);
    } else if (e.type === "network" || e.type === "server-error" || e.type === "socket-error") {
      setWaiting("Sem conexão com o servidor…", "Tentando de novo.");
      clearTimeout(retryTimer);
      retryTimer = setTimeout(() => { if (viewPeer && viewPeer.destroyed) createViewPeer(); else connectToHost(); }, 4000);
    } else console.warn("peer error", e.type, e);
  });

  viewPeer.on("call", (call) => {
    if (call.peer !== hostId) return call.close();
    clearTimeout(retryTimer);
    try { currentCall && currentCall.close(); } catch {}
    currentCall = call;
    call.answer(undefined, { sdpTransform });
    call.on("stream", (s) => {
      video.srcObject = s;
      setWaiting(null);
      video.play().catch(() => $("unmute").classList.remove("hidden"));
    });
    const pc = call.peerConnection;
    let lostTimer = null;
    pc.addEventListener("connectionstatechange", () => {
      const st = pc.connectionState;
      if (st === "connected") { clearTimeout(lostTimer); setWaiting(null); }
      if (st === "disconnected") {
        setWaiting("A conexão oscilou…", "Esperando voltar.");
        lostTimer = setTimeout(() => reconnectNow(), 6000);
      }
      if (st === "failed") {
        setWaiting("Não deu para conectar direto.", "Se isso se repetir, configure um servidor TURN (veja o LEIA-ME).");
        reconnectNow();
      }
    });
    call.on("close", () => { if (currentCall === call) { currentCall = null; setWaiting("A transmissão parou.", "Esperando voltar…"); scheduleRetry(2000); } });
  });
}

function reconnectNow() {
  try { currentCall && currentCall.close(); } catch {}
  currentCall = null;
  if (dataConn && dataConn.open) dataConn.send("reconnect");
  else scheduleRetry(1000);
}

function leaveWatch() {
  clearTimeout(retryTimer); clearInterval(statsTimer);
  try { currentCall && currentCall.close(); } catch {}
  const p = viewPeer; viewPeer = null; currentCall = null;
  if (p) p.destroy();
  $("remote").srcObject = null;
  if (document.fullscreenElement) document.exitFullscreen();
  show("lobby");
}

/* Estatísticas (tecla I) */
let lastBytes = 0, lastTs = 0;
async function updateStats() {
  if (!currentCall || $("stats").classList.contains("hidden")) return;
  const pc = currentCall.peerConnection;
  const report = await pc.getStats();
  let v = null, a = null, pair = null;
  const byId = {};
  report.forEach((r) => {
    byId[r.id] = r;
    if (r.type === "inbound-rtp" && r.kind === "video") v = r;
    if (r.type === "inbound-rtp" && r.kind === "audio") a = r;
    if (r.type === "candidate-pair" && r.nominated && r.state === "succeeded") pair = r;
  });
  const lines = [];
  if (v) {
    const kbps = lastTs ? ((v.bytesReceived - lastBytes) * 8) / (v.timestamp - lastTs) : 0;
    lastBytes = v.bytesReceived; lastTs = v.timestamp;
    const codec = v.codecId && byId[v.codecId] ? byId[v.codecId].mimeType.replace("video/", "") : "?";
    lines.push(`vídeo   ${v.frameWidth || "?"}x${v.frameHeight || "?"} @ ${v.framesPerSecond || 0} fps  (${codec})`);
    lines.push(`taxa    ${(kbps / 1000).toFixed(1)} Mbps`);
    lines.push(`perdas  ${v.packetsLost || 0} pacotes, ${v.framesDropped || 0} quadros`);
    if (v.jitterBufferEmittedCount) lines.push(`buffer  ${Math.round((v.jitterBufferDelay / v.jitterBufferEmittedCount) * 1000)} ms`);
  }
  if (a) {
    const codec = a.codecId && byId[a.codecId] ? byId[a.codecId] : null;
    lines.push(`áudio   ${codec ? codec.mimeType.replace("audio/", "") + " " + (codec.channels || "") + "ch" : "sim"}`);
  } else lines.push("áudio   não recebido");
  if (pair) {
    const local = byId[pair.localCandidateId], remote = byId[pair.remoteCandidateId];
    const relay = (local && local.candidateType === "relay") || (remote && remote.candidateType === "relay");
    lines.push(`rede    ${relay ? "via TURN" : "direta (P2P)"}, ida e volta ${pair.currentRoundTripTime ? Math.round(pair.currentRoundTripTime * 1000) : "?"} ms`);
  }
  $("stats").textContent = lines.join("\n");
}

/* Controles do player */
const video = $("remote");
function toggleMute() { video.muted = !video.muted; $("btnVol").textContent = video.muted ? "🔇" : "🔊"; }
function toggleFull() { document.fullscreenElement ? document.exitFullscreen() : $("viewer").requestFullscreen(); }
function toggleStats() { $("stats").classList.toggle("hidden"); lastTs = 0; updateStats(); }
$("btnVol").onclick = toggleMute;
$("vol").oninput = (e) => { video.volume = Number(e.target.value); if (video.muted && video.volume > 0) toggleMute(); };
$("btnFull").onclick = toggleFull;
$("btnStats").onclick = toggleStats;
$("btnLeave").onclick = leaveWatch;
$("remote").ondblclick = toggleFull;
$("unmute").onclick = () => { video.muted = false; video.play(); $("unmute").classList.add("hidden"); };
document.addEventListener("keydown", (e) => {
  if ($("viewer").classList.contains("hidden") || e.target.tagName === "INPUT") return;
  const k = e.key.toLowerCase();
  if (k === "f") toggleFull(); else if (k === "m") toggleMute(); else if (k === "i") toggleStats();
});
let idle;
$("viewer").addEventListener("mousemove", () => {
  $("bar").classList.remove("idle"); $("viewer").style.cursor = "";
  clearTimeout(idle);
  idle = setTimeout(() => { $("bar").classList.add("idle"); $("viewer").style.cursor = "none"; }, 2500);
});

$("btnHost").onclick = startHost;
$("btnWatch").onclick = startWatch;
$("btnSwitch").onclick = switchScreen;
$("btnStop").onclick = stopHost;
$("pass").addEventListener("keydown", (e) => { if (e.key === "Enter") startWatch(); });
</script>
</body>
